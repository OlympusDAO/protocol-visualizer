name: Security Audit

on:
  pull_request:
  push:
    branches: [master]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Verify runtime version alignment
        run: pnpm run check:runtime-versions

      - name: Install dependencies
        run: pnpm install

      - name: Run security audit
        run: pnpm audit --audit-level=high

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build indexer Docker image
        run: pnpm run docker:build:indexer

      - name: Tag indexer image for scan
        run: pnpm run docker:tag:scan:indexer

      - name: Build frontend Docker image
        run: pnpm run docker:build:frontend

      - name: Tag frontend image for scan
        run: pnpm run docker:tag:scan:frontend

      - name: Scan indexer Dockerfile for misconfigurations
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: Dockerfile-indexer
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan frontend Dockerfile for misconfigurations
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: Dockerfile-frontend
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan indexer image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: protocol-visualizer/indexer:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: protocol-visualizer/frontend:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
