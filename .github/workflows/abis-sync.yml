name: ABI registry sync

# Runs `pnpm abis:sync --latest` every day and opens one pull request with the
# changes. The daily run also finds the changes that env.json does not show,
# such as a policy that the Kernel activates, or a proxy upgrade.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abis-sync
  cancel-in-progress: false

jobs:
  # The install and sync steps run third-party code, so this job has a
  # read-only token. The pull-request job below has the write token and does
  # not install dependencies.
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Bootstrap
        uses: ./.github/actions/bootstrap

      - name: Sync ABI registry
        run: pnpm run abis:sync --latest
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ENVIO_RPC_URL_1: ${{ secrets.ENVIO_RPC_URL_1 }}
          ENVIO_RPC_URL_10: ${{ secrets.ENVIO_RPC_URL_10 }}
          ENVIO_RPC_URL_8453: ${{ secrets.ENVIO_RPC_URL_8453 }}
          ENVIO_RPC_URL_42161: ${{ secrets.ENVIO_RPC_URL_42161 }}
          ENVIO_RPC_URL_80094: ${{ secrets.ENVIO_RPC_URL_80094 }}
          ENVIO_RPC_URL_11155111: ${{ secrets.ENVIO_RPC_URL_11155111 }}

      - name: Check ABI registry
        run: pnpm run abis:check

      - name: Make the patch
        id: patch
        run: |
          mkdir -p "$RUNNER_TEMP/abis-sync"
          git add packages/contract-abis
          git diff --cached --binary -- packages/contract-abis > "$RUNNER_TEMP/abis-sync/abis.patch"
          if [ -s "$RUNNER_TEMP/abis-sync/abis.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "The ABI registry is up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: abis-sync-patch
          path: ${{ runner.temp }}/abis-sync/abis.patch
          if-no-files-found: error
          retention-days: 1

  pull-request:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the patch
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: abis-sync-patch
          path: ${{ runner.temp }}/abis-sync

      - name: Apply the patch
        run: git apply "$RUNNER_TEMP/abis-sync/abis.patch"

      # The action does not push if the branch already has these changes.
      - name: Open or update the pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bot/abis-sync
          add-paths: packages/contract-abis
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "chore(abis): sync ABI registry"
          title: "chore(abis): sync ABI registry"
          body: The scheduled ABI registry sync found changes. Review the diff of packages/contract-abis/abis/manifest.json, then merge.

      # A push with GITHUB_TOKEN does not start `on: pull_request` workflows.
      # GITHUB_TOKEN can start `workflow_dispatch`, and the checks of that run
      # show on the pull request.
      - name: Start CI on the pull request
        if: contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.pull-request-branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
