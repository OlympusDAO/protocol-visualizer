[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile-indexer"
watchPatterns = [
  "apps/indexer/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "railway-indexer.toml",
  "Dockerfile-indexer",
]

[deploy]
healthcheckPath = "/ready"
healthcheckTimeout = 3600

[variables]
PONDER_MAX_THREADS = "5"
PONDER_RPC_BLOCK_RANGE_80094 = "1000"
