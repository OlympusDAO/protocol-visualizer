name: ABI registry sync

# Runs `pnpm abis:sync --latest` and opens one pull request with the changes.
# olympus-v3 starts it with a repository_dispatch event of type
# env-json-updated when src/scripts/env.json changes on master.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [env-json-updated]

permissions:
  contents: read

concurrency:
  group: abis-sync
  cancel-in-progress: false

jobs:
  # The install and sync steps run third-party code, so this job has a
  # read-only token. The pull-request job below has the write token and does
  # not install dependencies.
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Bootstrap
        uses: ./.github/actions/bootstrap

      - name: Sync ABI registry
        run: pnpm run abis:sync --latest
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ENVIO_RPC_URL_1: ${{ secrets.ENVIO_RPC_URL_1 }}
          ENVIO_RPC_URL_10: ${{ secrets.ENVIO_RPC_URL_10 }}
          ENVIO_RPC_URL_8453: ${{ secrets.ENVIO_RPC_URL_8453 }}
          ENVIO_RPC_URL_42161: ${{ secrets.ENVIO_RPC_URL_42161 }}
          ENVIO_RPC_URL_80094: ${{ secrets.ENVIO_RPC_URL_80094 }}
          ENVIO_RPC_URL_11155111: ${{ secrets.ENVIO_RPC_URL_11155111 }}

      - name: Check ABI registry
        run: pnpm run abis:check

      - name: Make the patch
        id: patch
        run: |
          mkdir -p "$RUNNER_TEMP/abis-sync"
          git add packages/contract-abis
          git diff --cached --binary -- packages/contract-abis > "$RUNNER_TEMP/abis-sync/abis.patch"
          if [ -s "$RUNNER_TEMP/abis-sync/abis.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "The ABI registry is up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: abis-sync-patch
          path: ${{ runner.temp }}/abis-sync/abis.patch
          if-no-files-found: error
          retention-days: 1

  pull-request:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the patch
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: abis-sync-patch
          path: ${{ runner.temp }}/abis-sync

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/abis-sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git apply --index "$RUNNER_TEMP/abis-sync/abis.patch"
          git commit -m "chore(abis): sync ABI registry"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "chore(abis): sync ABI registry" \
              --body "The scheduled ABI registry sync found changes. Review the diff of packages/contract-abis/abis/manifest.json, then merge."
          fi
