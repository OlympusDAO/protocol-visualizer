name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: source-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Runtime versions
            command: pnpm check:runtime-versions
          - name: Format and lint
            command: pnpm check
          - name: Typecheck
            command: pnpm typecheck
            codegen: true
          - name: Build
            command: pnpm build
          - name: Tests
            command: pnpm test
            codegen: true
            build: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      # Codegen uses loopback fixtures; source checks need no Docker or live RPC.
      - name: Generate offline Envio types
        if: matrix.codegen == true
        run: pnpm codegen
      - name: Prepare test artifacts
        if: matrix.build == true
        run: pnpm build
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  # Image checks share this workflow; the standalone dependency audit is checked below.
  security-audit:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/security-scan.yml

  railway-plan:
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run-id: ${{ steps.plan-run.outputs.run-id }}
    steps:
      - name: Find reviewed production plan
        id: plan-run
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: context.sha, per_page: 100,
            });
            const pr = prs.find(pr => pr.merged_at && pr.merge_commit_sha === context.sha &&
              pr.base.ref === "master" && pr.head.repo?.full_name === context.payload.repository.full_name);
            if (!pr) {
              core.info("No same-repository PR merged at this commit; infrastructure apply is skipped.");
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });
            const paths = [".github/workflows/railway-config.yml", ".github/workflows/ci.yml",
              "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "mise.toml", "mise.lock", ".nvmrc", ".node-version"];
            if (!files.some(({ filename }) => !/\.md$/i.test(filename) && (paths.includes(filename) ||
              filename.startsWith(".railway/") || filename.startsWith(".github/actions/bootstrap/")))) {
              core.info("The merged PR does not affect Railway configuration; apply is skipped.");
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: "railway-config.yml", head_sha: pr.head.sha,
              event: "pull_request", status: "success", per_page: 1,
            });
            if (!data.workflow_runs.length) throw new Error("No successful plan for this PR head. Generate and review a fresh plan before applying.");
            core.setOutput("run-id", data.workflow_runs[0].id);

  railway-apply:
    timeout-minutes: 60
    needs: [source, security-audit, railway-plan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.railway-plan.outputs.run-id != ''
    runs-on: ubuntu-latest
    concurrency:
      group: railway-infrastructure-production
      cancel-in-progress: false
      queue: max
    env:
      RAILWAY_PROJECT_ID: d733dd5c-7076-48ad-ac8b-a147cb428300
      RAILWAY_ENVIRONMENT_ID: 1b61e496-b565-42b4-9e5d-8096e28e13cd
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
    steps:
      - name: Checkout merged configuration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Bootstrap runtime
        uses: ./.github/actions/bootstrap
        with:
          install-dependencies: "false"
      - name: Wait for external checks
        timeout-minutes: 35
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          MERGE_COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const { data: currentRun } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });
            if (!currentRun.check_suite_id) throw new Error("Cannot identify the CI workflow's own check suite.");
            // GitHub-managed CodeQL has no workflow file and uses the dynamic event.
            const requiredWorkflows = [[255339919, "dynamic"], ["audit.yml", "push"]];
            for (let attempt = 0; attempt < 120; attempt++) {
              let workflowsPassed = true;
              for (const [workflow, event] of requiredWorkflows) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  ...context.repo,
                  workflow_id: workflow,
                  head_sha: process.env.MERGE_COMMIT_SHA,
                  event,
                  per_page: 1,
                });
                const run = data.workflow_runs[0];
                if (run?.status === "completed" && run.conclusion !== "success") throw new Error(`${workflow}: ${run.conclusion}`);
                workflowsPassed &&= run?.status === "completed" && run.conclusion === "success";
              }
              if (workflowsPassed) {
                const reportedChecks = await github.paginate(github.rest.checks.listForRef, {
                  ...context.repo,
                  ref: process.env.MERGE_COMMIT_SHA,
                  filter: "latest",
                  per_page: 100,
                });
                // This apply job cannot finish until the gate returns.
                const checks = reportedChecks.filter(check => check.check_suite?.id !== currentRun.check_suite_id);
                const failedCheck = checks.find(check => check.status === "completed" && !["success", "neutral", "skipped"].includes(check.conclusion));
                if (failedCheck) throw new Error(`${failedCheck.name}: ${failedCheck.conclusion}`);
                const reportedStatuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                  ...context.repo,
                  ref: process.env.MERGE_COMMIT_SHA,
                  per_page: 100,
                });
                // Newest first. Railway deploys wait for this workflow, so its statuses cannot gate this apply.
                const latestStatuses = new Map();
                for (const status of reportedStatuses) {
                  const name = status.context.toLowerCase();
                  if (!name.startsWith("protocol-visualizer - ") && !latestStatuses.has(name)) latestStatuses.set(name, status);
                }
                const statuses = [...latestStatuses.values()];
                const failedStatus = statuses.find(status => ["failure", "error"].includes(status.state));
                if (failedStatus) throw new Error(`${failedStatus.context}: ${failedStatus.state}`);
                if (checks.length > 0 && checks.every(check => check.status === "completed") && statuses.every(status => status.state === "success")) {
                  core.info("Native CI jobs and external checks passed; production infrastructure apply may proceed.");
                  return;
                }
              }
              core.info("Waiting for dependency audit, CodeQL and external commit checks on the merge commit.");
              await new Promise(resolve => setTimeout(resolve, 15_000));
            }
            throw new Error("Timed out waiting for external checks; production infrastructure was not applied.");
      - name: Verify cache password before infrastructure apply
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node scripts/check-cache-database-password.mjs
      - name: Download pinned plan
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: railway-production-plan
          path: ${{ runner.temp }}/railway-plan
          run-id: ${{ needs.railway-plan.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify production plan target
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PLAN_PATH: ${{ runner.temp }}/railway-plan/railway-plan.json
        with:
          script: |
            const plan = JSON.parse(require("fs").readFileSync(process.env.PLAN_PATH, "utf8"));
            if (plan.environmentId !== process.env.RAILWAY_ENVIRONMENT_ID) {
              throw new Error("Saved plan targets a different Railway environment. Generate and review a production plan.");
            }
            // CLI 5.75 source updates can redeploy a database despite severity=safe.
            // Main image transitions require the separately approved fresh-data release.
            if (plan.kind !== "railway.config.plan" || plan.version !== 1 ||
                plan.changeSet?.version !== 1 || !Array.isArray(plan.changeSet.changes)) {
              throw new Error("Unsupported saved plan change set; refusing automatic production apply.");
            }
            for (const change of plan.changeSet.changes) {
              if (!change || typeof change.kind !== "string" || typeof change.address !== "string") {
                throw new Error("Incomplete saved plan change; refusing automatic production apply.");
              }
              if (change.address === "database.Postgres" && change.kind === "resource.update" &&
                  change.field === "source" && (typeof change.before?.image !== "string" ||
                    typeof change.after?.image !== "string" || change.before.image !== change.after.image)) {
                throw new Error("Main database image transition requires a separately approved manual reset/reindex and native apply; automatic production apply is blocked.");
              }
            }
            const sourceTree = require("child_process").execFileSync("git", ["rev-parse", "HEAD:.railway"], { encoding: "utf8" }).trim();
            if (plan.sourceTree !== sourceTree) {
              throw new Error("Saved plan does not match the merged IaC tree. Update the branch and review a fresh production plan.");
            }
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: "master" });
            if (branch.commit.sha !== context.sha) {
              throw new Error("Production branch advanced; refusing an outdated queued apply.");
            }
      - name: Apply reviewed production plan
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        with:
          script: |
            if (!process.env.RAILWAY_API_TOKEN) throw new Error("Set the RAILWAY_TOKEN Actions secret to an Olympus workspace API token.");
            // Native 5.75 saved-plan apply can exit zero on failed/partial results.
            // Keep both streams private: outputs/diagnostics can contain secrets.
            const applied = require("child_process").spawnSync("railway", [
              "config", "apply", "--environment", "production", "--plan",
              `${process.env.RUNNER_TEMP}/railway-plan/railway-plan.json`, "--yes", "--json",
            ], { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"], maxBuffer: 16 * 1024 * 1024 });
            if (applied.error || applied.status !== 0) throw new Error("Native Railway apply failed; raw output withheld. Verify the target before any retry.");
            let result;
            try { result = JSON.parse(applied.stdout); }
            catch { throw new Error("Native Railway apply returned malformed JSON; raw output withheld."); }
            const accepted = new Set(["applied", "noop"]);
            if (!accepted.has(result?.status) || !Array.isArray(result.changes) ||
                !result.changes.every(change => accepted.has(change?.status))) {
              throw new Error("Native Railway apply did not report applied/noop for the result and every change; raw output withheld. Do not retry blindly.");
            }
            core.info("Native apply result accepted. Deployment acceptance still requires a fresh read-only plan and complete HTTP/TCP inventory.");
