name: Security Audit

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: security-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  images:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rpc-cache
            name: Cache + integration
          - image: indexer
            name: Indexer
          - image: frontend
            name: Frontend
          - image: hasura
            name: Hasura
          - image: snapshot-gateway
            name: Snapshot gateway
          - image: snapshot-publisher
            name: Snapshot publisher
          - image: snapshot-monitor
            name: Snapshot monitor
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Bootstrap
        id: bootstrap
        uses: ./.github/actions/bootstrap
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build application image
        id: build
        run: pnpm run container:build:${{ matrix.image }}
      # Full functional fixtures need only eRPC, indexer and their native PG fixture.
      # One cheap indexer rebuild avoids transferring images or rebuilding Go twice.
      - name: Build integration companion
        id: companion
        if: matrix.image == 'rpc-cache'
        run: pnpm run container:build:indexer
      - name: Scan application image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run container:scan -- ${{ matrix.image }}
      - name: Check Dockerfile
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: trivy config --severity MEDIUM,HIGH,CRITICAL --exit-code 1 --file-patterns 'dockerfile:Dockerfile-*' Dockerfile-${{ matrix.image }}
      - name: Check runtime image policy
        if: ${{ !cancelled() && matrix.image == 'rpc-cache' && steps.bootstrap.outcome == 'success' }}
        # Railway PostgreSQL stays advisory/not-run; local fixtures stay excluded.
        run: pnpm run container:scan:runtime
      - name: Required PostgreSQL, cache, reset and docs integration
        # A scan failure must not prevent functional validation of successful builds.
        if: ${{ !cancelled() && matrix.image == 'rpc-cache' && steps.build.outcome == 'success' && steps.companion.outcome == 'success' }}
        run: pnpm test:integration
