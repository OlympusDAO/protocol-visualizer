# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: protocol-visualizer-indexer
description: Olympus protocol visualizer indexer

field_selection:
  transaction_fields:
    - hash

contracts:
  - name: Kernel
    abi_file_path: ./abis/json/Kernel.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "ActionExecuted(uint8 indexed action_, address indexed target_)"

  - name: OlympusRoles
    abi_file_path: ./abis/json/OlympusRoles.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "RoleGranted(bytes32 indexed role_, address indexed addr_)"
      - event: "RoleRevoked(bytes32 indexed role_, address indexed addr_)"

  - name: RolesAdmin
    abi_file_path: ./abis/json/RolesAdmin.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "NewAdminPulled(address indexed newAdmin_)"

  - name: IEnabler
    abi_file_path: ./abis/json/IEnabler.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "Enabled()"
      - event: "Disabled()"

  - name: IEnablerV2
    abi_file_path: ./abis/json/IEnabler.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "Transition(address indexed by, bool indexed enable, bytes data, uint48 at)"

