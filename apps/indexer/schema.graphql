enum ContractType {
  KERNEL
  MODULE
  POLICY
}

type Contract {
  id: ID!
  address: String! @index
  lastUpdatedTimestamp: BigInt!
  lastUpdatedBlockNumber: BigInt! @index
  name: String! @index
  version: String
  contractType: ContractType! @index
  isEnabled: Boolean! @index
  kernelHistory: String
  policyPermissions: Json
  policyFunctions: Json
}

type KernelExecutor {
  id: ID!
  kernel: String! @index
  lastUpdatedTimestamp: BigInt!
  lastUpdatedBlockNumber: BigInt! @index
  executor: String! @index
}

type Role {
  id: ID!
  role: String! @index
}

type RoleAssignment {
  id: ID!
  role: String! @index
  assignee: String! @index
  assigneeName: String!
  lastUpdatedTimestamp: BigInt!
  lastUpdatedBlockNumber: BigInt! @index
  isGranted: Boolean! @index
}

type CurrentModule {
  id: ID!
  keycode: String! @index
  address: String! @index
  lastUpdatedTimestamp: BigInt!
  lastUpdatedBlockNumber: BigInt! @index
}

type CurrentRoleAssignee {
  id: ID!
  role: String! @index
  assignee: String! @index
  assigneeName: String!
  lastUpdatedTimestamp: BigInt!
  lastUpdatedBlockNumber: BigInt! @index
}

# Current control state is independent from Contract.isEnabled (Kernel membership).
# Json provenance uses {number,hash,timestamp}, all numeric values encoded as strings.
type ContractState {
  id: ID!
  address: String! @index
  enablerCapability: String!
  enabled: Boolean
  seed: Json
  lastChange: Json
  indexedThrough: Json
  verification: Json!
  enablementGetter: String
  enablementCoverage: String
}

type ControlTransition {
  id: ID!
  address: String! @index
  kind: String! @index
  previousValue: Json
  value: Json!
  blockNumber: BigInt! @index
  blockHash: String! @index
  timestamp: BigInt!
  transactionHash: String! @index
  logIndex: Int!
}

type ContractRelationship {
  callSelector: String
  callSignature: String
  id: ID!
  kind: String! @index
  source: String! @index
  target: String @index
  status: String!
  scope: Json
  provenance: Json!
  subject: String @index
  getter: String
  value: String
  seed: Json
  lastChange: Json
  indexedThrough: Json
  verification: Json
  coverage: String
  functionContext: Json
  targetCode: String
}

type ChainObservation {
  id: ID!
  indexedThrough: Json!
  verificationVersion: Int!
}

type HeartTasks {
  id: ID!
  address: String! @index
  tasks: Json
  seed: Json
  lastChange: Json
  indexedThrough: Json
  verification: Json!
}

type BridgeConfiguration {
  id: ID!
  address: String! @index
  kind: String!
  configuration: Json
  selectors: [String!]!
  observedAt: Json
  lastChange: Json
  verification: Json!
}
