name: Dependency Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      - name: Verify runtime version alignment
        run: pnpm run check:runtime-versions

      - name: Audit pnpm dependencies (fail on moderate+)
        id: audit
        shell: bash
        env:
          PNPM_CONFIG_FETCH_TIMEOUT: "300000"
          PNPM_CONFIG_FETCH_RETRIES: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/pnpm-audit-result"
          set +e
          pnpm audit --audit-level moderate --json \
            > "$RUNNER_TEMP/pnpm-audit-result/audit.json"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Upload audit result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pnpm-audit-result
          path: ${{ runner.temp }}/pnpm-audit-result/audit.json
          if-no-files-found: error
          retention-days: 1

      - name: Enforce audit result
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
