name: Security Audit

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: security-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  images:
    name: Images and required cache integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build and scan repository-owned application images and Dockerfiles
        # Provider PostgreSQL is advisory/not-run; local fixtures are excluded.
        run: pnpm validate:images
      - name: Verify cache persistence, restart and reset isolation
        run: pnpm test:integration
