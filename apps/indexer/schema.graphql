enum ContractType {
  KERNEL
  MODULE
  POLICY
}

enum ActionType {
  installModule
  upgradeModule
  activatePolicy
  deactivatePolicy
  changeExecutor
  migrateKernel
}

type Contract {
  id: ID!
  chainId: Int! @index
  address: String! @index
  lastUpdatedTimestamp: BigInt!
  lastUpdatedBlockNumber: BigInt! @index
  name: String! @index
  version: String
  contractType: ContractType! @index
  isEnabled: Boolean! @index
  policyPermissions: Json
  policyFunctions: Json
}

type ContractEvent {
  id: ID!
  chainId: Int! @index
  transactionHash: String! @index
  logIndex: Int!
  action: ActionType! @index
  address: String! @index
  timestamp: BigInt!
  blockNumber: BigInt! @index
  name: String!
  version: String
  contractType: ContractType!
  isEnabled: Boolean!
  policyPermissions: Json
  policyFunctions: Json
}

type KernelExecutor {
  id: ID!
  chainId: Int! @index
  kernel: String! @index
  lastUpdatedTimestamp: BigInt!
  lastUpdatedBlockNumber: BigInt! @index
  executor: String! @index
}

type KernelExecutorEvent {
  id: ID!
  chainId: Int! @index
  kernel: String! @index
  transactionHash: String! @index
  logIndex: Int!
  timestamp: BigInt!
  blockNumber: BigInt! @index
  executor: String! @index
}

type ActionExecutedEvent {
  id: ID!
  chainId: Int! @index
  kernel: String! @index
  transactionHash: String! @index
  logIndex: Int!
  timestamp: BigInt!
  blockNumber: BigInt! @index
  action: ActionType! @index
  target: String! @index
}

type RoleEvent {
  id: ID!
  chainId: Int! @index
  role: String! @index
  transactionHash: String! @index
  logIndex: Int!
  assignee: String! @index
  timestamp: BigInt!
  blockNumber: BigInt! @index
  assigneeName: String!
  isGranted: Boolean! @index
}

type Role {
  id: ID!
  chainId: Int! @index
  role: String! @index
}

type RoleAssignment {
  id: ID!
  chainId: Int! @index
  role: String! @index
  assignee: String! @index
  assigneeName: String!
  lastUpdatedTimestamp: BigInt!
  lastUpdatedBlockNumber: BigInt! @index
  isGranted: Boolean! @index
}

type CurrentModule {
  id: ID!
  chainId: Int! @index
  keycode: String! @index
  address: String! @index
  lastUpdatedTimestamp: BigInt!
  lastUpdatedBlockNumber: BigInt! @index
}

type CurrentRoleAssignee {
  id: ID!
  chainId: Int! @index
  role: String! @index
  assignee: String! @index
  assigneeName: String!
  lastUpdatedTimestamp: BigInt!
  lastUpdatedBlockNumber: BigInt! @index
}

# Current control state is independent from Contract.isEnabled (Kernel membership).
# Json provenance uses {number,hash,timestamp}, all numeric values encoded as strings.
type ContractState {
  id: ID!
  chainId: Int! @index
  address: String! @index
  enablerCapability: String!
  enabled: Boolean
  seed: Json
  lastChange: Json
  indexedThrough: Json
  verification: Json!
}

type ContractStateSeed {
  id: ID!
  chainId: Int! @index
  address: String! @index
  boundary: Json!
  getter: String!
  value: String!
}

type ControlTransition {
  id: ID!
  chainId: Int! @index
  address: String! @index
  kind: String! @index
  previousValue: Json
  value: Json!
  blockNumber: BigInt! @index
  blockHash: String! @index
  timestamp: BigInt!
  transactionHash: String! @index
  logIndex: Int!
}

type ContractRelationship {
  id: ID!
  chainId: Int! @index
  kind: String! @index
  source: String! @index
  target: String @index
  status: String!
  scope: Json
  provenance: Json!
  subject: String @index
  getter: String
  value: String
  seed: Json
  lastChange: Json
  indexedThrough: Json
  verification: Json
  coverage: String
  functionContext: Json
  targetCode: String
}

type ChainObservation {
  id: ID!
  chainId: Int! @index
  indexedThrough: Json!
}
