name: Railway infrastructure

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".railway/**"
      - ".github/workflows/railway-config.yml"
      - ".github/actions/bootstrap/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".node-version"

permissions:
  contents: read

env:
  RAILWAY_PROJECT_ID: d733dd5c-7076-48ad-ac8b-a147cb428300
  RAILWAY_ENVIRONMENT_ID: 1b61e496-b565-42b4-9e5d-8096e28e13cd

# Serialize production plans/applies and retain pending runs instead of replacing them.
concurrency:
  group: railway-infrastructure-production
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      - name: Verify IaC
        run: pnpm run railway:check
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.71.0
      - name: Plan production changes
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          test -n "$RAILWAY_API_TOKEN" || { echo "Set the RAILWAY_TOKEN Actions secret to an Olympus workspace API token." >&2; exit 1; }
          umask 077
          railway config plan --environment production --out "$RUNNER_TEMP/railway-plan.json"
      - name: Upload reviewed plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: railway-production-plan
          path: ${{ runner.temp }}/railway-plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Link production plan from the PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const marker = "<!-- railway-config-plan -->";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nProduction infrastructure plan: [review changes and the pinned artifact](${url}).\nMerge applies this saved plan. Destructive changes require a separate operator action.`;
            const args = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, args);
            const existing = comments.find(c => c.user?.login === "github-actions[bot]" && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...args, body });
            }

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout merged configuration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.71.0
      - name: Find successful plan for the merged PR head
        id: plan-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PLAN_RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow railway-config.yml --commit "$PR_HEAD_SHA" --event pull_request --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$PLAN_RUN_ID" || { echo "No successful plan for this PR head. Generate and review a fresh plan before applying." >&2; exit 1; }
          echo "run-id=$PLAN_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download pinned plan
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: railway-production-plan
          path: ${{ runner.temp }}/railway-plan
          run-id: ${{ steps.plan-run.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify production plan target
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PLAN_PATH: ${{ runner.temp }}/railway-plan/railway-plan.json
        with:
          script: |
            const plan = JSON.parse(require("fs").readFileSync(process.env.PLAN_PATH, "utf8"));
            if (plan.environmentId !== process.env.RAILWAY_ENVIRONMENT_ID) {
              throw new Error("Saved plan targets a different Railway environment. Generate and review a production plan.");
            }
      - name: Apply reviewed production plan
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          test -n "$RAILWAY_API_TOKEN" || { echo "Set the RAILWAY_TOKEN Actions secret to an Olympus workspace API token." >&2; exit 1; }
          railway config apply --environment production --plan "$RUNNER_TEMP/railway-plan/railway-plan.json" --yes
