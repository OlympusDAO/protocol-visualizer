# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: protocol-visualizer-indexer
description: Olympus protocol visualizer indexer

field_selection:
  transaction_fields:
    - hash

contracts:
  - name: LegacyPeriodicTask
    abi_file_path: ./abis/json/LegacyPeriodicTask.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "Activated()"
      - event: "Deactivated()"
      - event: "Shutdown()"
  - name: PeriodicTaskManager
    abi_file_path: ./abis/json/PeriodicTaskManager.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "PeriodicTaskAdded(address indexed task_, bytes4 customSelector_, uint256 indexed index_)"
      - event: "PeriodicTaskRemoved(address indexed task_, uint256 indexed index_)"
  - name: MonoCoolerReferences
    abi_file_path: ./abis/json/MonoCoolerReferences.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "LtvOracleSet(address indexed oracle)"
      - event: "TreasuryBorrowerSet(address indexed treasuryBorrower)"
  - name: Kernel
    abi_file_path: ./abis/json/Kernel.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "ActionExecuted(uint8 indexed action_, address indexed target_)"

  - name: OlympusRoles
    abi_file_path: ./abis/json/OlympusRoles.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "RoleGranted(bytes32 indexed role_, address indexed addr_)"
      - event: "RoleRevoked(bytes32 indexed role_, address indexed addr_)"

  - name: RolesAdmin
    abi_file_path: ./abis/json/RolesAdmin.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "NewAdminPulled(address indexed newAdmin_)"

  - name: IEnabler
    abi_file_path: ./abis/json/IEnabler.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "Enabled()"
      - event: "Disabled()"

  - name: IEnablerV2
    abi_file_path: ./abis/json/IEnabler.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "Transition(address indexed by, bool indexed enable, bytes data, uint48 at)"

  - name: Owned
    abi_file_path: ./abis/json/Owned.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "OwnershipTransferred(address indexed user, address indexed newOwner)"

  - name: OlympusAccessControlled
    abi_file_path: ./abis/json/OlympusAccessControlled.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "AuthorityUpdated(address indexed authority)"

  - name: StakedOHM
    abi_file_path: ./abis/json/StakedOHM.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "LogStakingContractUpdated(address stakingContract)"

  - name: OlympusAuthority
    abi_file_path: ./abis/json/OlympusAuthority.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "GovernorPushed(address indexed from, address indexed to, bool _effectiveImmediately)"
      - event: "GovernorPulled(address indexed from, address indexed to)"
      - event: "GuardianPushed(address indexed from, address indexed to, bool _effectiveImmediately)"
      - event: "GuardianPulled(address indexed from, address indexed to)"
      - event: "PolicyPushed(address indexed from, address indexed to, bool _effectiveImmediately)"
      - event: "PolicyPulled(address indexed from, address indexed to)"
      - event: "VaultPushed(address indexed from, address indexed to, bool _effectiveImmediately)"
      - event: "VaultPulled(address indexed from, address indexed to)"

  - name: GovernanceOHM
    abi_file_path: ./abis/json/GovernanceOHM.json
    handler: ./src/EventHandlers.ts
    events: []

  - name: ChainlinkOwned
    abi_file_path: ./abis/json/ChainlinkOwned.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "OwnershipTransferRequested(address indexed from, address indexed to)"
      - event: "OwnershipTransferred(address indexed from, address indexed to)"

  - name: TokenAdminRegistry
    abi_file_path: ./abis/json/TokenAdminRegistry.json
    handler: ./src/EventHandlers.ts
    events:
      - event: "AdministratorTransferRequested(address indexed token, address indexed currentAdmin, address indexed newAdmin)"
      - event: "AdministratorTransferred(address indexed token, address indexed newAdmin)"
      - event: "PoolSet(address indexed token, address indexed previousPool, address indexed newPool)"

