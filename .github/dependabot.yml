version: 2
# Security updates only; zero limits disable routine version-update PRs.
updates:
  # Root package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    versioning-strategy: increase

  # Frontend app
  - package-ecosystem: "npm"
    directory: "/apps/frontend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    versioning-strategy: increase

  # Indexer app
  - package-ecosystem: "npm"
    directory: "/apps/indexer"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    versioning-strategy: increase

  # Snapshot publisher app
  - package-ecosystem: "npm"
    directory: "/apps/snapshot-publisher"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    versioning-strategy: increase

  # Snapshot gateway app (TypeScript)
  - package-ecosystem: "npm"
    directory: "/apps/snapshot-gateway"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    versioning-strategy: increase
