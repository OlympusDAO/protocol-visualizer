name: Dependency Audit Comment

on:
  workflow_run:
    workflows: ["Dependency Audit"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download audit result
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pnpm-audit-result
          path: ${{ runner.temp }}/pnpm-audit-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update pull request comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          AUDIT_RESULT_PATH: ${{ runner.temp }}/pnpm-audit-result/audit.json
          AUDIT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const fs = require("fs");

            const marker = "<!-- pnpm-audit -->";
            const pullRequests = context.payload.workflow_run.pull_requests;
            if (!Array.isArray(pullRequests) || pullRequests.length !== 1) {
              core.setFailed("Expected exactly one pull request for the audit run");
              return;
            }

            const issueNumber = Number(pullRequests[0].number);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed("Invalid pull request number");
              return;
            }

            const resultPath = process.env.AUDIT_RESULT_PATH;
            const resultSize = fs.statSync(resultPath).size;
            if (resultSize > 1024 * 1024) {
              core.setFailed("Audit result exceeds the 1 MiB safety limit");
              return;
            }

            let result = {};
            try {
              result = JSON.parse(fs.readFileSync(resultPath, "utf8"));
            } catch {
              if (process.env.AUDIT_CONCLUSION === "success") {
                core.setFailed("Successful audit run produced invalid JSON");
                return;
              }
            }
            const advisories = Object.values(result.advisories ?? {});
            const reportable = advisories
              .filter((advisory) =>
                ["moderate", "high", "critical"].includes(advisory.severity)
              )
              .slice(0, 50);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (
              reportable.length === 0 &&
              process.env.AUDIT_CONCLUSION === "success"
            ) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            const escapeMarkdown = (value) =>
              String(value ?? "")
                .replaceAll("\\", "\\\\")
                .replaceAll("`", "\\`")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");
            const lines = reportable.map((advisory) => {
              const severity = escapeMarkdown(advisory.severity);
              const packageName = escapeMarkdown(advisory.module_name);
              const title = escapeMarkdown(advisory.title);
              return `- **${severity}** \`${packageName}\`: ${title}`;
            });
            if (lines.length === 0) {
              lines.push("- The audit did not complete successfully.");
            }
            const summary =
              reportable.length > 0
                ? "Moderate-or-higher vulnerabilities were found:"
                : "The dependency audit failed before producing a valid report:";
            const body = [
              marker,
              "## pnpm audit",
              "",
              summary,
              "",
              ...lines,
              "",
              `[View audit run](${process.env.WORKFLOW_RUN_URL})`,
            ].join("\n");

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
